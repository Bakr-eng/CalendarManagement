name: CI CalendarManagement

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CalendarManagementBackend
    steps:
      - name: Pull all code
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CalendarManagementBackend.slnx

      - name: Build
        run: dotnet build CalendarManagementBackend.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test CalendarManagementBackend.slnx --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CalendarManagementFrontend
    steps:
      - name: Pull all code
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: CalendarManagementFrontend/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
